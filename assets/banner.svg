<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Traffic Packet Gradient -->
    <linearGradient id="trafficGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="trafficGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
    }

    @keyframes dashStream {
      to {
        stroke-dashoffset: -80;
      }
    }

    @keyframes floatingPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes packetFlow1 {
      0% { offset-distance: 0%; opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    .line-flow {
      stroke: #334155;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dashStream 3s linear infinite;
    }

    .line-active-1 {
      stroke: #38bdf8;
      stroke-width: 2.5;
      stroke-dasharray: 8 8;
      animation: dashStream 2s linear infinite;
    }

    .line-active-2 {
      stroke: #818cf8;
      stroke-width: 2.5;
      stroke-dasharray: 8 8;
      animation: dashStream 2.4s linear infinite;
    }

    .line-active-3 {
      stroke: #34d399;
      stroke-width: 2.5;
      stroke-dasharray: 8 8;
      animation: dashStream 2.2s linear infinite;
    }

    .pill-l4 {
      animation: floatingPill 4s ease-in-out infinite;
    }

    .pill-l7 {
      animation: floatingPill 4.5s ease-in-out infinite 0.8s;
    }

    .pill-mesh {
      animation: floatingPill 3.8s ease-in-out infinite 1.5s;
    }

    .traffic-dot {
      r: 4;
      fill: #67e8f9;
      filter: url(#glow);
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.12">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M120,0 V340 M240,0 V340 M360,0 V340 M480,0 V340 M600,0 V340 M720,0 V340 M840,0 V340 M960,0 V340 M1080,0 V340" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Infrastructure Network Graphics (Positioned around borders to ensure text remains 100% clear) -->
  <g id="network-topology" opacity="0.75">
    <!-- Left Ingress Node -->
    <circle cx="100" cy="170" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <text x="100" y="175" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">CLIENT</text>

    <!-- Flow Paths from Ingress to Central Balancer Hub -->
    <path d="M128,170 C 180,170 190,170 230,170" class="line-active-1" />

    <!-- Virtual Load Balancer Node -->
    <rect x="230" y="136" width="68" height="68" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" filter="url(#subtleGlow)" />
    <text x="264" y="172" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ADC / LB</text>

    <!-- Branching Paths from Load Balancer into Top/Bottom Background Tracks -->
    <!-- Top Route -->
    <path d="M298,155 C 360,155 380,65 480,65 L 720,65 C 820,65 840,140 910,140" class="line-active-1" fill="none" />
    <!-- Bottom Route -->
    <path d="M298,185 C 360,185 380,275 480,275 L 720,275 C 820,275 840,200 910,200" class="line-active-3" fill="none" />

    <!-- Backend Target Nodes (Right side) -->
    <!-- Backend 1 (Top) -->
    <rect x="910" y="80" width="170" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <circle cx="930" cy="101" r="5" fill="#34d399" />
    <text x="948" y="106" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Target Group: Alpha</text>
    <path d="M890,140 C 900,140 900,101 910,101" class="line-active-1" fill="none" />

    <!-- Backend 2 (Middle) -->
    <rect x="910" y="149" width="170" height="42" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.8" />
    <circle cx="930" cy="170" r="5" fill="#34d399" />
    <text x="948" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Target Group: Beta</text>
    <path d="M890,170 L 910,170" class="line-active-2" fill="none" />

    <!-- Backend 3 (Bottom) -->
    <rect x="910" y="218" width="170" height="42" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.8" />
    <circle cx="930" cy="239" r="5" fill="#34d399" />
    <text x="948" y="244" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Target Group: Gamma</text>
    <path d="M890,200 C 900,200 900,239 910,239" class="line-active-3" fill="none" />
  </g>

  <!-- Interactive/Dynamic Floating Feature Badges (Top & Bottom Center) -->
  <g class="pill-l4">
    <rect x="420" y="44" width="105" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="472" y="62" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ L4 Layer (TCP/UDP)</text>
  </g>

  <g class="pill-l7">
    <rect x="540" y="44" width="115" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <text x="597" y="62" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🌐 L7 Routing (HTTP/3)</text>
  </g>

  <g class="pill-mesh">
    <rect x="670" y="44" width="110" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
    <text x="725" y="62" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🛡️ High Availability</text>
  </g>

  <!-- FOREGROUND: Title & Subtitle (Always prominent, centered, high contrast, guaranteed visible) -->
  <g id="branding-foreground">
    <!-- Drop Shadow Background Card for Foreground Text -->
    <rect x="330" y="105" width="540" height="135" rx="14" fill="#0b1120" fill-opacity="0.88" stroke="#334155" stroke-width="1.5" filter="url(#subtleGlow)" />
    
    <!-- Main Title -->
    <text x="600" y="152" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Load Balancers
    </text>

    <!-- Gradient Highlight Accent Line -->
    <rect x="510" y="166" width="180" height="3" rx="1.5" fill="url(#trafficGrad1)" />

    <!-- Subtitle -->
    <text x="600" y="194" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">
      Curated Ecosystem for L4/L7 Traffic Distribution, Reverse Proxies &amp; ADC
    </text>

    <!-- Subtitle Meta Tagline -->
    <text x="600" y="218" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.8">
      ENTERPRISE SAAS • PRODUCTION CLOUD • HIGH-PERFORMANCE OPEN SOURCE
    </text>
  </g>
</svg>
